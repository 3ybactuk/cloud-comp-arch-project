# By default, your evolution will run for 50 iterations; feel free to change this value as needed.
# At any time, you can resume evolution from a specific checkpoint by providing the --checkpoint flag to openevolve-run.
max_iterations: 50
checkpoint_interval: 1 # Do not change this

llm:
  api_base: "https://api.swissai.cscs.ch/v1"
  primary_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
  top_p: 0.95
  temperature: 0.85
  timeout: 600
  retries: 4
  max_tokens: 4096

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: false
  template_dir: "prompts"

  system_message: |
    You optimize a Kubernetes batch scheduler by modifying get_policy() in a small Python file.

    Cluster: node-a-8core (8 CPU, memcached uses 2 threads → 6 CPUs free for batch),
    node-b-4core (4 CPU, batch only). CPU budget: threads * 0.9 per job, no overcommit.
    node values: "node-a-8core" or "node-b-4core". job values: any of the 7 in ALL_JOBS.
    All 7 jobs must appear exactly once across all waves. Waves run sequentially - jobs in a wave run in parallel.

    Goal: minimize makespan (seconds from first job start to last job end) while keeping
    memcached p95 < 1ms at 30k QPS. Baseline: 378s.

    HARD CONSTRAINTS (violations → slo_factor=0, combined_score capped at 0.2):
    - freqmine and vips MUST run on node-b-4core. They trash LLC and break memcached SLO on node-a.
    - canneal does not scale past 2 threads — never set threads > 2 for canneal.
    - node-b-4core has 4 CPUs total. Sum of (threads * 0.9) across concurrent jobs must not exceed 4.
    - node-a-8core has 6 CPUs free (after memcached). Sum of (threads * 0.9) must not exceed 6.

    Return ONLY the complete Python file. No markdown, no fences, no backticks, no prose.
    Start response with exactly: from __future__ import annotations

database:
  population_size: 200 # Do not change this

evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1
  timeout: 7200

diff_based_evolution: false
max_code_length: 50000
